name: Android CI (Compile NetAudioTalk APK)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    # 修改这里：显式指定 gradle-version，这样云端就会自己下载配套环境，不再强求项目根目录有 gradlew 文件
    - name: Setup and Run Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '7.5'
        arguments: assembleDebug
        
    # 当编译成功后，负责把 app-debug.apk 提取出来供你下载
    - name: Upload Output APK
      uses: actions/upload-artifact@v4
      with:
        name: NetAudioTalk-V1.0-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
