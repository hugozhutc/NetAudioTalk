name: Android CI (Compile NetAudioTalk APK)

# 触发条件：当 main 分支有代码 push 或者提交 PR 时触发编译
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 拉取仓库代码
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. 设置 JDK 环境（Android SDK 33 推荐使用 Java 11 或 17，此处采用企业级稳定的 Java 17）
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. 赋予 Gradle 脚本执行权限，防止 Linux 环境下报 Permission Denied 错误
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. 执行 Gradle 编译构建命令（编译 Debug 测试版本）
    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug

    # 5. 将编译生成的 APK 文件上传作为 GitHub Artifacts 回传给用户下载
    - name: Upload Output APK
      uses: actions/upload-artifact@v4
      with:
        name: NetAudioTalk-V1.0-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
